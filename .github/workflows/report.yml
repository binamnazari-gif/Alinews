name: report

on:
  schedule:
    # چند نوبت در روز؛ ساعت‌ها به UTC‌اند: ۰۹:۱۷ تا ۲۱:۱۷ به وقت تهران، هر دو ساعت.
    # روزی فقط یک گزارش می‌رود: اگر امروز فرستاده شده باشد، نوبت‌های بعدی بی‌صدا رد می‌شوند.
    - cron: "47 5,7,9,11,13,15,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          today=$(TZ=Asia/Tehran date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(cat docs/last_sent.txt 2>/dev/null)" = "$today" ]; then
            echo "already sent for $today - skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.skip != 'true'
        run: pip install flask requests
      - if: steps.gate.outputs.skip != 'true'
        run: python report.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add docs
          git commit -m "update report" || exit 0
          git push
